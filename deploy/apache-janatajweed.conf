# Serves the Jana Tajweed web app at https://quranvideomaker.com/janatajweed (files built by deploy/deploy.sh).
# Goes in the :443 vhost of quranvideomaker.com in /etc/httpd/conf.d/site-quran.conf, ABOVE the line
# "ProxyPass / http://127.0.0.1:3100/": Apache uses the first ProxyPass that matches, and "/" matches everything.
# Then: apachectl configtest && systemctl reload httpd

ProxyPass /janatajweed !
Alias /janatajweed /var/www/janatajweed
<Directory /var/www/janatajweed>
    Options -Indexes
    AllowOverride None
    Require all granted
    DirectoryIndex index.html
</Directory>

# The page and the service worker are checked on every visit, so a new deploy reaches phones on their next open.
# Everything in assets/ has its content hash in the name and can be kept for a year.
<LocationMatch "^/janatajweed/(index\.html|sw\.js|manifest\.webmanifest)?$">
    Header set Cache-Control "no-cache"
</LocationMatch>
<Location /janatajweed/assets/>
    Header set Cache-Control "public, max-age=31536000, immutable"
</Location>

# No accounts server runs here yet: /janatajweed/api answers 404 and the app keeps everything on the device.
